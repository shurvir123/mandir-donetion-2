<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Dashboard</title><style>
body{font-family:Arial;margin:0;background:#f4f6fb;color:#182033}.wrap{max-width:1200px;margin:auto;padding:30px 18px}.card{background:#fff;padding:24px;border-radius:16px;box-shadow:0 8px 25px #0001;margin-bottom:20px}
input{padding:11px;border:1px solid #ccd2df;border-radius:8px;width:100%;box-sizing:border-box;margin:6px 0 12px}button{padding:11px 16px;border:0;border-radius:8px;background:#6336c7;color:#fff;font-weight:bold;cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:11px;border-bottom:1px solid #eee;text-align:left}th{background:#f4f1ff}.verify{background:#18864b}.reject{background:#b42318;margin-left:5px}.hide{display:none}.status{font-weight:bold}
</style></head><body><div class="wrap">
<div class="card" id="login"><h2>Admin Login</h2><input id="ae" type="email" placeholder="Admin email"><input id="ap" type="password" placeholder="Password"><button onclick="login()">Login</button><p id="lm"></p></div>
<div class="hide" id="dash"><div class="card"><h1>Donation Admin Dashboard</h1><button onclick="logout()">Logout</button><button onclick="load()" style="margin-left:8px">Refresh</button></div>
<div class="card"><table><thead><tr><th>Donor</th><th>Amount</th><th>UTR</th><th>Date</th><th>Status</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></div>
</div>
<script>
async function login(){let r=await fetch("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:ae.value,password:ap.value})});let d=await r.json();if(r.ok){loginEl.classList.add("hide");dash.classList.remove("hide");load()}else lm.textContent=d.error}
const loginEl=document.getElementById("login");
async function load(){let r=await fetch("/api/admin/donations");if(r.status===401)return;let a=await r.json();rows.innerHTML=a.map(d=>`<tr><td>${esc(d.donor_name)}<br>${esc(d.email)}</td><td>₹${d.amount}</td><td>${esc(d.utr)}</td><td>${d.payment_date}</td><td class="status">${d.status}</td><td>${d.status==="PENDING VERIFICATION"?`<button class="verify" onclick="verify(${d.id})">Verify Payment</button><button class="reject" onclick="rejectD(${d.id})">Reject</button>`:d.certificate_number||"-"}</td></tr>`).join("")}
async function verify(id){if(!confirm("Confirm that you checked this UTR/payment and it is genuine?"))return;let r=await fetch("/api/admin/donations/"+id+"/verify",{method:"POST"});let d=await r.json();alert(d.message);load()}
async function rejectD(id){if(!confirm("Reject this payment?"))return;await fetch("/api/admin/donations/"+id+"/reject",{method:"POST"});load()}
async function logout(){await fetch("/api/admin/logout",{method:"POST"});location.reload()}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
</script></body></html>
