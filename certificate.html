<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verified Donation Certificate</title>
<style>body{font-family:Arial;background:#f5f7ff;margin:0}.box{max-width:800px;margin:40px auto;background:white;padding:45px;text-align:center;border:12px solid #6336c7;box-sizing:border-box}.small{letter-spacing:3px;color:#6336c7;font-weight:bold}.name{font-size:34px;font-weight:bold;margin:22px}.amount{font-size:28px;color:#6336c7;font-weight:bold}.verified{color:#138a4b;font-weight:bold;margin:20px}.id{font-size:13px;color:#666}@media(max-width:600px){.box{margin:10px;padding:25px 12px}.name{font-size:25px}}</style></head>
<body><div class="box"><div class="small">RAJ SARANG</div><h1>DONATION CERTIFICATE</h1><p>Presented to</p><div class="name" id="n"></div><p>for the generous donation of</p><div class="amount">₹ <span id="a"></span></div><p>Purpose: <b id="p"></b></p><p>Donation Date: <b id="d"></b></p><p>Donation ID: <b id="di"></b></p><p>Certificate Number: <b id="c"></b></p><div class="verified">✓ VERIFIED DONATION PAYMENT</div><p>Thank you for supporting our cause.</p></div>
<script>
(async()=>{let cert=location.pathname.split("/").pop();let r=await fetch("/api/certificate/"+encodeURIComponent(cert));let x=await r.json();if(!r.ok){document.querySelector(".box").innerHTML="<h2>Certificate not found</h2>";return}n.textContent=x.donor_name;a.textContent=x.amount;p.textContent=x.purpose;d.textContent=x.payment_date;di.textContent=x.donation_id;c.textContent=x.certificate_number})()
</script></body></html>
